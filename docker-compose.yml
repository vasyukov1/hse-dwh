services:
  postgres-master:
    container_name: postgres-master
    image: postgres:17
    restart: always
    ports:
      - "${POSTGRES_MASTER_PORT}:5432"
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MASTER_PORT: ${POSTGRES_MASTER_PORT}
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf' -c 'hba_file=/etc/postgresql/pg_hba.conf'
    volumes:
      - ./postgres-master-data:/var/lib/postgresql/data                                 # data
      - ./init-script:/etc/postgresql/init-script                                       # init
      - ./init-script/common-config/postgresql.conf:/etc/postgresql/postgresql.conf:ro  # config
      - ./init-script/common-config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro          # access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - postgres-network

  postgres-replica:
    container_name: postgres-replica
    image: postgres:17
    restart: always
    ports:
      - "${POSTGRES_REPLICA_PORT}:5432"
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICA_PORT: ${POSTGRES_REPLICA_PORT}
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf' -c 'hba_file=/etc/postgresql/pg_hba.conf'
    volumes:
      - ./postgres-replica-data:/var/lib/postgresql/data                                # data
      - ./init-script/common-config/postgresql.conf:/etc/postgresql/postgresql.conf:ro  # config
      - ./init-script/common-config/pg_hba.conf:/etc/postgresql/pg_hba.conf             # access
    networks:
      - postgres-network

  starrocks:
    container_name: starrocks
    image: starrocks/allin1-ubuntu:3.3.3
    ports:
      - "${STARROCKS_FE_HTTP_PORT:-8030}:8030"
      - "${STARROCKS_FE_MYSQL_PORT:-9030}:9030"
      - "${STARROCKS_BE_HTTP_PORT:-8040}:8040"
    volumes:
      - ./starrocks-data/fe:/opt/starrocks/fe/doris-meta
      - ./starrocks-data/be:/opt/starrocks/be/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8030/api/bootstrap"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - postgres-network

  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.7.0
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      CLUSTER_ID: "dpewbNkETgCahBhaTTyh0Q"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - postgres-network

  debezium:
    container_name: debezium
    image: debezium/connect:2.5
    restart: always
    depends_on:
      - kafka
      - postgres-master
    ports:
      - "${DEBEZIUM_PORT}:8083"
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      CONNECT_BOOTSTRAP_SERVERS: "kafka:9092"
      CONFIG_STORAGE_TOPIC: "debezium_configs"
      CONNECT_CONFIG_STORAGE_TOPIC: "debezium_configs"
      OFFSET_STORAGE_TOPIC: "debezium_offsets"
      CONNECT_OFFSET_STORAGE_TOPIC: "debezium_offsets"
      STATUS_STORAGE_TOPIC: "debezium_statuses"
      CONNECT_STATUS_STORAGE_TOPIC: "debezium_statuses"
      CONNECT_GROUP_ID: "connect-cluster-1"
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: "debezium"
    networks:
      - postgres-network

  dmp-service:
    build: ./dmp
    container_name: dmp-service
    depends_on:
      - kafka
      - starrocks
      - debezium
    environment:
      PYTHONUNBUFFERED: "1"
      DWH_HOST: ${DWH_HOST}
      DWH_PORT: ${DWH_PORT}
      DWH_DB: ${DWH_DB}
      DWH_USER: ${DWH_USER}
      DWH_PASSWORD: ${DWH_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:9092
    networks:
      - postgres-network

  x-airflow-common: &airflow-common
    build: ./airflow
    image: hse-dwh-airflow:local
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Uses existing postgres-master to store Airflow metadata
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-master:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "change-me-in-production-please-32chars"
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "60"
      # StarRocks connection for DAGs
      STARROCKS_HOST: starrocks
      STARROCKS_PORT: "9030"
      STARROCKS_USER: root
      STARROCKS_PASSWORD: ""
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    networks:
      - postgres-network

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    depends_on:
      postgres-master:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        echo 'Creating airflow_db if not exists...'
        PGPASSWORD="${POSTGRES_PASSWORD:-postgres}" psql \
          -h postgres-master \
          -U "${POSTGRES_USER:-postgres}" \
          -tc "SELECT 1 FROM pg_database WHERE datname='airflow_db'" \
          | grep -q 1 \
          || PGPASSWORD="${POSTGRES_PASSWORD:-postgres}" psql \
               -h postgres-master \
               -U "${POSTGRES_USER:-postgres}" \
               -c "CREATE DATABASE airflow_db"
        echo 'Running airflow db migrate...'
        airflow db migrate
        echo 'Creating admin user...'
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          2>/dev/null || true
        echo 'Airflow init complete!'
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      postgres-master:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      postgres-master:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  metabase:
    image: metabase/metabase:v0.49.6
    container_name: metabase
    ports:
      - "${METABASE_PORT:-3000}:3000"
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_OPTS: "-Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: always
    networks:
      - postgres-network


networks:
  postgres-network:
    driver: bridge

volumes:
  airflow-logs:
  metabase-data:
